<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>Koloběžníkův rozpočet</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 90px; }
    header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0.85rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    main { padding: 1rem; max-width: 600px; margin: 0 auto; }
    .card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem; margin-bottom: 1rem; }
    .card-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.35rem; }
    .metric-value { font-size: 1.1rem; font-weight: 700; }
    .metric-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <h1>Koloběžníkův rozpočet</h1>
    <div id="status-badge" style="font-size: 0.8rem; color: var(--text-muted);">Kontrola souborů...</div>
  </header>

  <main id="app-container">
    <div class="card">
      <div class="card-title">Test načítání modulů</div>
      <div id="check-output" class="metric-sub">Ověřuji přítomnost souborů na GitHub Pages...</div>
    </div>
  </main>

  <script type="module">
    const files = [
      './db.js',
      './initial-data.js',
      './budget.js',
      './debts.js',
      './receivables-goals.js',
      './backup.js'
    ];

    const out = document.getElementById('check-output');
    out.innerHTML = '';

    let missing = [];

    for (const f of files) {
      try {
        const resp = await fetch(f);
        const text = await resp.text();
        if (!resp.ok || text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
          missing.push(f);
          out.innerHTML += `<div style="color: var(--accent-red); margin-bottom: 0.3rem;">❌ Nalezen problém: <strong>${f}</strong> (vrací 404 nebo HTML místo JS)</div>`;
        } else {
          out.innerHTML += `<div style="color: var(--accent-green); margin-bottom: 0.3rem;">✓ V pořádku: <strong>${f}</strong></div>`;
        }
      } catch (err) {
        missing.push(f);
        out.innerHTML += `<div style="color: var(--accent-red); margin-bottom: 0.3rem;">❌ Nelze načíst: <strong>${f}</strong> (${err.message})</div>`;
      }
    }

    if (missing.length === 0) {
      document.getElementById('status-badge').textContent = 'Všechny soubory nalezeny!';
      document.getElementById('status-badge').style.color = 'var(--accent-green)';
      out.innerHTML += '<div style="margin-top: 0.8rem; color: var(--accent); font-weight: bold;">Všechny soubory jsou dostupné. Přepínám na plnou aplikaci...</div>';
      // Pokud je vše v pořádku, načteme plnou aplikaci
      location.replace('./index.html?verified=1');
    } else {
      document.getElementById('status-badge').textContent = 'Chybí soubor!';
      document.getElementById('status-badge').style.color = 'var(--accent-red)';
    }
  </script>
</body>
</html>
