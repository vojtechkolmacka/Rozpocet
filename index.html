<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>Koloběžníkův rozpočet</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 90px; }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; }

    .period-badge {
      background-color: var(--border);
      color: var(--text-main);
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    main { padding: 1rem; max-width: 600px; margin: 0 auto; }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: 1rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .metric-value { font-size: 1.35rem; font-weight: 800; }
    .metric-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

    .item-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .expense-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: border-color 0.15s ease;
    }

    .expense-item.paid {
      border-color: rgba(34, 197, 94, 0.4);
      background-color: rgba(34, 197, 94, 0.05);
    }

    .expense-item.paid .expense-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .expense-info { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; cursor: pointer; }
    .expense-name { font-size: 0.95rem; font-weight: 600; }
    .expense-meta { font-size: 0.75rem; color: var(--text-muted); }

    .expense-right { display: flex; align-items: center; gap: 0.6rem; text-align: right; }
    .expense-amount { font-size: 0.95rem; font-weight: 700; cursor: pointer; }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: transparent;
      cursor: pointer;
    }

    .expense-item.paid .check-circle {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
      font-weight: bold;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 0.25rem 0.35rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .btn-primary { background-color: var(--accent); color: #000; }
    .btn-success { background-color: var(--accent-green); color: #000; }
    .btn-secondary { background-color: var(--border); color: var(--text-main); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .sub-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
    }
    .sub-item-row:last-child { border-bottom: none; }

    .progress-bar-bg {
      background-color: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      background-color: var(--accent-green);
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Koloběžníkův rozpočet</h1>
    <div id="current-period" class="period-badge">Načítám...</div>
  </header>

  <main id="app-container">
    <div class="card">
      <div class="card-title">Stav</div>
      <div class="metric-value" style="color: var(--accent);">Načítám rozpočet...</div>
    </div>
  </main>

  <nav class="nav-bar">
    <button id="nav-expenses" class="nav-btn">Platby</button>
    <button id="nav-debts" class="nav-btn active">Půjčky & Dluhy</button>
    <button id="nav-goals" class="nav-btn">Cíle</button>
    <button id="nav-settings" class="nav-btn">Nastavení</button>
  </nav>

  <script>
    const DB_NAME = 'KolobeznikRozpocetDB';
    const DB_VERSION = 2;

    function toCents(amount) {
      if (amount === null || amount === undefined || amount === '') return 0;
      if (typeof amount === 'string') amount = amount.replace(/\s/g, '').replace(',', '.');
      const num = parseFloat(amount);
      return isNaN(num) ? 0 : Math.round(num * 100);
    }

    function formatKc(cents) {
      const crowns = (cents || 0) / 100;
      return new Intl.NumberFormat('cs-CZ', {
        style: 'currency',
        currency: 'CZK',
        minimumFractionDigits: crowns % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }).format(crowns);
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('recurring_templates')) db.createObjectStore('recurring_templates', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('monthly_expenses')) {
            const s = db.createObjectStore('monthly_expenses', { keyPath: 'id', autoIncrement: true });
            s.createIndex('period', 'period', { unique: false });
          }
          if (!db.objectStoreNames.contains('incomes')) db.createObjectStore('incomes', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('debts_payable')) db.createObjectStore('debts_payable', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('debts_receivable')) db.createObjectStore('debts_receivable', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('savings_goals')) db.createObjectStore('savings_goals', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('accounts')) db.createObjectStore('accounts', { keyPath: 'id', autoIncrement: true });
        };
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbAdd(storeName, item) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).add(item);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).put(item);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbDelete(storeName, id) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).delete(id);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function clearStore(storeName) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).clear();
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });
    }

    // --- VÝCHOZÍ DATA A INICIALIZACE POHLEDÁVEK (15. 10. 2026) ---
    async function seedInitialData(forceReload = false) {
      const existingReceivables = await dbGetAll('debts_receivable');
      
      if (existingReceivables.length === 0 || forceReload) {
        await clearStore('debts_receivable');

        const initialList = [
          // KOV (Celkem 6 650 Kč)
          { debtor: 'KOV', category: 'Půjčky', originalAmountCents: toCents('3400'), remainingAmountCents: toCents('3400'), history: [] },
          { debtor: 'KOV', category: 'Elektřina a drogerie', originalAmountCents: toCents('2750'), remainingAmountCents: toCents('2750'), history: [] },
          { debtor: 'KOV', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] },

          // JIŘÍ (Celkem 750 Kč)
          { debtor: 'JIŘÍ', category: 'Půjčky', originalAmountCents: toCents('0'), remainingAmountCents: toCents('0'), history: [] },
          { debtor: 'JIŘÍ', category: 'Elektřina a drogerie', originalAmountCents: toCents('1500'), remainingAmountCents: toCents('250'), history: [{ date: '2026-10-13', amountCents: toCents('1250'), type: 'payment', note: 'Zaplaceno na elektřinu a drogerii' }] },
          { debtor: 'JIŘÍ', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] },

          // MAGDA (Celkem 2 700 Kč)
          { debtor: 'MAGDA', category: 'Půjčky', originalAmountCents: toCents('700'), remainingAmountCents: toCents('700'), history: [] },
          { debtor: 'MAGDA', category: 'Elektřina a drogerie', originalAmountCents: toCents('1500'), remainingAmountCents: toCents('1500'), history: [] },
          { debtor: 'MAGDA', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] }
        ];

        for (const item of initialList) {
          await dbAdd('debts_receivable', item);
        }
      }

      const existingTemplates = await dbGetAll('recurring_templates');
      if (existingTemplates.length === 0) {
        const defaultExpenses = [
          { name: 'Česká televize', amountCents: toCents('150'), category: 'Bydlení a média', dueDay: 15, active: true },
          { name: 'Vodafone – telefon', amountCents: toCents('266'), category: 'Komunikace', dueDay: 15, active: true },
          { name: 'T-Mobile – internet', amountCents: toCents('450'), category: 'Komunikace', dueDay: 20, active: true },
          { name: 'PVZP – pojištění', amountCents: toCents('400'), category: 'Pojištění', dueDay: 20, active: true },
          { name: 'AvaFin/Crediton – splátka', amountCents: toCents('1100'), category: 'Dluhy a splátky', dueDay: 10, isLoanRepayment: true, active: true },
          { name: 'Provident – splátka', amountCents: toCents('1500'), category: 'Dluhy a splátky', dueDay: 10, isLoanRepayment: true, active: true },
          { name: 'Penzijní příspěvek', amountCents: toCents('100'), category: 'Spoření', dueDay: 15, active: true },
          { name: 'ČEZ – záloha na elektřinu', amountCents: toCents('3000'), category: 'Energie', dueDay: 15, active: true },
          { name: 'Terapie', amountCents: toCents('2000'), category: 'Zdraví a péče', dueDay: 1, active: true },
          { name: 'Investown', amountCents: toCents('500'), category: 'Investice', dueDay: 10, active: true },
          { name: 'ChatGPT Go', amountCents: toCents('200'), category: 'Předplatné a software', dueDay: 1, active: true },
          { name: 'SIPO', amountCents: toCents('77'), category: 'Bydlení', dueDay: 12, active: true },
          { name: 'Spotify', amountCents: toCents('185'), category: 'Zábava', dueDay: 5, active: true },
          { name: 'Google AI Pro', amountCents: toCents('139,90'), category: 'Předplatné a software', dueDay: 8, active: true }
        ];
        for (const item of defaultExpenses) await dbAdd('recurring_templates', item);

        await dbAdd('debts_payable', { name: 'Provident', principalRemainingCents: toCents('77327,33'), monthlyPaymentCents: toCents('1500'), dueDay: 10 });
        await dbAdd('debts_payable', { name: 'AvaFin/Crediton', principalRemainingCents: toCents('19524'), monthlyPaymentCents: toCents('1100'), dueDay: 10 });

        await dbAdd('savings_goals', { name: 'Celková finanční rezerva a velké výdaje', targetCents: toCents('180000'), allocatedCents: 0 });
        await dbAdd('savings_goals', { name: 'Zubní náhrada', targetCents: toCents('30000'), allocatedCents: 0 });
        await dbAdd('savings_goals', { name: 'Cestování do Itálie, Monaka a Nice', targetCents: toCents('16000'), allocatedCents: 0 });
        await dbAdd('savings_goals', { name: 'Nová koloběžka', targetCents: toCents('25000'), allocatedCents: 0 });
        await dbAdd('savings_goals', { name: 'Brikety na zimu', targetCents: toCents('20000'), allocatedCents: 0 });
        await dbAdd('savings_goals', { name: 'Právní výdaje', targetCents: toCents('0'), allocatedCents: 0 });
      }
    }

    function getPeriodKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    async function ensureMonthInitialized(periodKey) {
      const allMonthly = await dbGetAll('monthly_expenses');
      const monthItems = allMonthly.filter(item => item.period === periodKey);
      if (monthItems.length > 0) return monthItems;

      const templates = await dbGetAll('recurring_templates');
      const created = [];
      for (const t of templates) {
        if (t.active === false) continue;
        const item = {
          templateId: t.id,
          name: t.name,
          category: t.category,
          plannedAmountCents: t.amountCents,
          paidAmountCents: 0,
          dueDay: t.dueDay || 15,
          period: periodKey,
          isPaid: false,
          isLoanRepayment: !!t.isLoanRepayment
        };
        const id = await dbAdd('monthly_expenses', item);
        item.id = id;
        created.push(item);
      }
      return created;
    }

    let activeTab = 'debts';
    const currentPeriod = getPeriodKey();

    const czechMonths = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
    const now = new Date();
    document.getElementById('current-period').textContent = `${czechMonths[now.getMonth()]} ${now.getFullYear()}`;

    document.getElementById('nav-expenses').addEventListener('click', () => setTab('expenses'));
    document.getElementById('nav-debts').addEventListener('click', () => setTab('debts'));
    document.getElementById('nav-goals').addEventListener('click', () => setTab('goals'));
    document.getElementById('nav-settings').addEventListener('click', () => setTab('settings'));

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'expenses') document.getElementById('nav-expenses').classList.add('active');
      if (tab === 'debts') document.getElementById('nav-debts').classList.add('active');
      if (tab === 'goals') document.getElementById('nav-goals').classList.add('active');
      if (tab === 'settings') document.getElementById('nav-settings').classList.add('active');
      render();
    }

    // --- ZÁLOŽKA 1: PLATBY ---
    async function renderExpenses() {
      const allExpenses = await dbGetAll('monthly_expenses');
      const monthExpenses = allExpenses.filter(e => e.period === currentPeriod);

      let unpaidCents = 0;
      let paidCents = 0;
      let paidCount = 0;

      for (const e of monthExpenses) {
        if (e.isPaid) {
          paidCents += e.plannedAmountCents;
          paidCount++;
        } else {
          unpaidCents += e.plannedAmountCents;
        }
      }

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Zbývá doplatit</div>
            <div class="metric-value" style="color: var(--accent-red);">${formatKc(unpaidCents)}</div>
            <div class="metric-sub">${monthExpenses.length - paidCount} z ${monthExpenses.length} položek</div>
          </div>
          <div class="card">
            <div class="card-title">Zaplaceno</div>
            <div class="metric-value" style="color: var(--accent-green);">${formatKc(paidCents)}</div>
            <div class="metric-sub">${paidCount} hotovo</div>
          </div>
        </div>

        <button id="btn-add-expense" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
          + Přidat novou platbu / výdaj
        </button>

        <div style="margin: 0.5rem 0 0.5rem 0; display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">
            Platby v tomto měsíci
          </h2>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Kolečko = zaplaceno | ✏️ = úprava</span>
        </div>

        <div id="expenses-list" class="item-list"></div>
      `;

      document.getElementById('btn-add-expense').addEventListener('click', async () => {
        const name = prompt('Název nové platby:');
        if (!name || !name.trim()) return;
        const amountStr = prompt(`Částka pro "${name}" v Kč:`);
        if (!amountStr || !amountStr.trim()) return;
        const dueDayStr = prompt('Den splatnosti v měsíci (1 až 31):', '15');
        const isRecurring = confirm(`Má se "${name}" opakovat každý měsíc automaticky?\n\n[OK] = Ano, trvalá měsíční platba\n[Zrušit] = Ne, pouze jednorázový výdaj`);

        const amountCents = toCents(amountStr);
        const dueDay = parseInt(dueDayStr, 10) || 15;

        let templateId = null;
        if (isRecurring) {
          templateId = await dbAdd('recurring_templates', {
            name: name.trim(),
            amountCents,
            category: 'Pravidelné',
            dueDay,
            active: true
          });
        }

        await dbAdd('monthly_expenses', {
          templateId,
          name: name.trim(),
          category: isRecurring ? 'Pravidelné' : 'Jednorázové',
          plannedAmountCents: amountCents,
          paidAmountCents: 0,
          dueDay,
          period: currentPeriod,
          isPaid: false
        });

        await render();
      });

      const listContainer = document.getElementById('expenses-list');
      monthExpenses.forEach(item => {
        const div = document.createElement('div');
        div.className = `expense-item ${item.isPaid ? 'paid' : ''}`;
        div.innerHTML = `
          <div class="expense-info">
            <div class="expense-name">${item.name}</div>
            <div class="expense-meta">Splatnost: ${item.dueDay}. v měsíci | ${item.category}</div>
          </div>
          <div class="expense-right">
            <div class="expense-amount">${formatKc(item.plannedAmountCents)}</div>
            <button class="btn-icon btn-edit-item" title="Upravit / Smazat">✏️</button>
            <div class="check-circle">✓</div>
          </div>
        `;

        const checkCircle = div.querySelector('.check-circle');
        const infoArea = div.querySelector('.expense-info');
        const toggleHandler = async () => {
          item.isPaid = !item.isPaid;
          await dbPut('monthly_expenses', item);
          await render();
        };
        checkCircle.addEventListener('click', toggleHandler);
        infoArea.addEventListener('click', toggleHandler);

        const btnEdit = div.querySelector('.btn-edit-item');
        btnEdit.addEventListener('click', async (e) => {
          e.stopPropagation();
          const action = prompt(`Úprava: ${item.name}\nAktuálně: ${(item.plannedAmountCents / 100).toFixed(2)} Kč\n\n1 = Změnit částku\n2 = Přejmenovat\n3 = Smazat platbu`, '1');
          if (action === '1') {
            const val = prompt('Nová částka v Kč:', (item.plannedAmountCents / 100).toFixed(2));
            if (val !== null && val.trim() !== '') {
              item.plannedAmountCents = toCents(val);
              await dbPut('monthly_expenses', item);
              await render();
            }
          } else if (action === '2') {
            const val = prompt('Nový název:', item.name);
            if (val && val.trim()) {
              item.name = val.trim();
              await dbPut('monthly_expenses', item);
              await render();
            }
          } else if (action === '3') {
            if (confirm(`Opravdu smazat "${item.name}"?`)) {
              await dbDelete('monthly_expenses', item.id);
              await render();
            }
          }
        });

        listContainer.appendChild(div);
      });
    }

    // --- ZÁLOŽKA 2: DLUHY & POHLEDÁVKY S PLNÝM PŘIČÍTÁNÍM A ODČÍTÁNÍM ---
    async function renderDebts() {
      const debts = await dbGetAll('debts_payable');
      const totalDebtCents = debts.reduce((sum, d) => sum + d.principalRemainingCents, 0);

      const receivables = await dbGetAll('debts_receivable');
      const totalReceivableCents = receivables.reduce((sum, r) => sum + r.remainingAmountCents, 0);

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Moje dluhy</div>
            <div class="metric-value" style="color: var(--accent-red);">${formatKc(totalDebtCents)}</div>
            <div class="metric-sub">Pravidlo 10. dne</div>
          </div>
          <div class="card">
            <div class="card-title">Dluží mně</div>
            <div class="metric-value" style="color: var(--accent-green);">${formatKc(totalReceivableCents)}</div>
            <div class="metric-sub">Celkem pohledávky</div>
          </div>
        </div>

        <div style="margin: 1.25rem 0 0.5rem 0; display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">
            Kdo mi dluží (Pohledávky)
          </h2>
          <button id="btn-add-new-debtor" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">+ Nová osoba</button>
        </div>

        <div id="receivables-grouped" class="item-list"></div>

        <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 1.5rem 0 0.5rem 0;">
          Moje půjčky k úhradě
        </h2>
        <div id="debts-list" class="item-list"></div>
      `;

      // Přidání nové osoby
      document.getElementById('btn-add-new-debtor').addEventListener('click', async () => {
        const name = prompt('Jméno nebo přezdívka nové osoby:');
        if (!name || !name.trim()) return;
        const category = prompt('Za co dluží (např. Půjčky, Elektřina, jiné):', 'Půjčky');
        const amount = prompt('Částka v Kč:');
        if (amount && amount.trim()) {
          await dbAdd('debts_receivable', {
            debtor: name.trim().toUpperCase(),
            category: category ? category.trim() : 'Půjčky',
            originalAmountCents: toCents(amount),
            remainingAmountCents: toCents(amount),
            history: [{ date: new Date().toISOString().slice(0, 10), amountCents: toCents(amount), type: 'loan', note: 'Vznik dluhu' }]
          });
          await render();
        }
      });

      // Získání unikátních dlužníků
      const debtorNames = [...new Set(receivables.map(r => r.debtor.toUpperCase()))];
      const groupedContainer = document.getElementById('receivables-grouped');

      debtorNames.forEach(personName => {
        const personItems = receivables.filter(r => r.debtor.toUpperCase() === personName);
        const personTotalCents = personItems.reduce((sum, r) => sum + r.remainingAmountCents, 0);

        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0.85rem';

        let rowsHtml = '';
        personItems.forEach(item => {
          let lastHistory = '';
          if (item.history && item.history.length > 0) {
            const last = item.history[item.history.length - 1];
            const prefix = last.type === 'payment' ? '✓ Zaplaceno' : '+ Přičteno';
            const color = last.type === 'payment' ? 'var(--accent-green)' : 'var(--accent-red)';
            lastHistory = `<div style="font-size: 0.7rem; color: ${color}; margin-top: 0.15rem;">${prefix} ${formatKc(last.amountCents)} (${last.date})</div>`;
          }

          rowsHtml += `
            <div class="sub-item-row">
              <div style="flex: 1;">
                <strong>${item.category}</strong>
                ${lastHistory}
              </div>
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-weight: 700; color: ${item.remainingAmountCents > 0 ? 'var(--text-main)' : 'var(--text-muted)'}; font-size: 0.95rem;">
                  ${formatKc(item.remainingAmountCents)}
                </span>
                <button class="btn-icon btn-edit-category" data-id="${item.id}" title="Upravit částku ručně">✏️</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
            <div>
              <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent);">${personName}</div>
              <div class="expense-meta">${personItems.length} položky dluhu</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 1.25rem; font-weight: 800; color: var(--accent-green);">${formatKc(personTotalCents)}</div>
              <div class="expense-meta">Celkem dluží</div>
            </div>
          </div>

          <div>${rowsHtml}</div>

          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            <button class="btn btn-secondary btn-add-debt" style="flex: 1; font-size: 0.75rem; border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">
              + Půjčit / Přičíst
            </button>
            <button class="btn btn-success btn-pay-debt" style="flex: 1; font-size: 0.75rem;">
              − Zadat úhradu
            </button>
          </div>
        `;

        // 1. TLAČÍTKO: PŮJČIT / PŘIČÍST
        card.querySelector('.btn-add-debt').addEventListener('click', async () => {
          const catPrompt = `Vyber za co ${personName} dluží / půjčuje si:\n\n1 = Půjčky\n2 = Elektřina a drogerie\n3 = Fólie na bazén\n4 = Jiné (zadat vlastní název)`;
          const choice = prompt(catPrompt, '1');
          if (!choice) return;

          let chosenCategory = 'Půjčky';
          if (choice === '2') chosenCategory = 'Elektřina a drogerie';
          else if (choice === '3') chosenCategory = 'Fólie na bazén';
          else if (choice === '4') {
            const custom = prompt('Zadej vlastní důvod / položku:');
            if (custom && custom.trim()) chosenCategory = custom.trim();
          }

          const amountStr = prompt(`Kolik Kč si ${personName} půjčuje / vzniká dluh za "${chosenCategory}"?`);
          if (!amountStr || !amountStr.trim()) return;
          const addCents = toCents(amountStr);

          const dateStr = prompt('Datum vzniku dluhu (RRRR-MM-DD):', new Date().toISOString().slice(0, 10));

          // Hledáme existující položku dané kategorie pro danou osobu
          let existingItem = personItems.find(i => i.category.toLowerCase() === chosenCategory.toLowerCase());

          if (existingItem) {
            existingItem.remainingAmountCents += addCents;
            existingItem.originalAmountCents += addCents;
            if (!existingItem.history) existingItem.history = [];
            existingItem.history.push({
              date: dateStr || new Date().toISOString().slice(0, 10),
              amountCents: addCents,
              type: 'loan',
              note: `Přičteno: ${chosenCategory}`
            });
            await dbPut('debts_receivable', existingItem);
          } else {
            await dbAdd('debts_receivable', {
              debtor: personName,
              category: chosenCategory,
              originalAmountCents: addCents,
              remainingAmountCents: addCents,
              history: [{
                date: dateStr || new Date().toISOString().slice(0, 10),
                amountCents: addCents,
                type: 'loan',
                note: `Přičteno: ${chosenCategory}`
              }]
            });
          }

          await render();
        });

        // 2. TLAČÍTKO: ZADAT ÚHRADU (ODEČÍST)
        card.querySelector('.btn-pay-debt').addEventListener('click', async () => {
          let catMenu = `Na kterou položku ${personName} platí?\n\n`;
          personItems.forEach((it, idx) => {
            catMenu += `${idx + 1} = ${it.category} (zbývá: ${(it.remainingAmountCents / 100).toFixed(0)} Kč)\n`;
          });

          const choice = prompt(catMenu, '1');
          if (!choice) return;
          const idx = parseInt(choice, 10) - 1;
          const targetItem = personItems[idx];
          if (!targetItem) {
            alert('Neplatná volba položky.');
            return;
          }

          const defaultAmount = (targetItem.remainingAmountCents / 100).toFixed(0);
          const valStr = prompt(`Kolik Kč ${personName} zaplatil/a na "${targetItem.category}"?`, defaultAmount);
          if (!valStr || !valStr.trim()) return;

          const paidCents = toCents(valStr);
          const dateStr = prompt('Datum zaplacení (RRRR-MM-DD):', new Date().toISOString().slice(0, 10));

          targetItem.remainingAmountCents = Math.max(0, targetItem.remainingAmountCents - paidCents);
          if (!targetItem.history) targetItem.history = [];
          targetItem.history.push({
            date: dateStr || new Date().toISOString().slice(0, 10),
            amountCents: paidCents,
            type: 'payment',
            note: `Zaplaceno na ${targetItem.category}`
          });

          await dbPut('debts_receivable', targetItem);
          await render();
        });

        // 3. RUČNÍ EDITACE ČÁSTKY (✏️)
        card.querySelectorAll('.btn-edit-category').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = parseInt(btn.getAttribute('data-id'), 10);
            const target = receivables.find(r => r.id === id);
            if (!target) return;

            const action = prompt(`Položka: ${target.debtor} – ${target.category}\nAktuálně zbývá: ${(target.remainingAmountCents / 100).toFixed(2)} Kč\n\n1 = Zadat přesnou novou částku zůstatku\n2 = Smazat tuto položku`, '1');
            if (action === '1') {
              const val = prompt('Nový skutečný zůstatek v Kč:', (target.remainingAmountCents / 100).toFixed(2));
              if (val !== null && val.trim() !== '') {
                target.remainingAmountCents = toCents(val);
                await dbPut('debts_receivable', target);
                await render();
              }
            } else if (action === '2') {
              if (confirm(`Opravdu smazat položku "${target.category}" u ${target.debtor}?`)) {
                await dbDelete('debts_receivable', target.id);
                await render();
              }
            }
          });
        });

        groupedContainer.appendChild(card);
      });

      // Výpis mých dluhů k úhradě
      const debtsList = document.getElementById('debts-list');
      debts.forEach(debt => {
        if (!debt.paymentHistory) debt.paymentHistory = [];
        const isPaidThisMonth = debt.paymentHistory.some(p => p.period === currentPeriod);

        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0.5rem';

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <div>
              <div style="font-size: 1.05rem; font-weight: 700;">${debt.name}</div>
              <div class="expense-meta">Měsíční splátka: ${formatKc(debt.monthlyPaymentCents)} (k 10. dni)</div>
            </div>
            ${isPaidThisMonth
              ? `<span style="color: var(--accent-green); font-size: 0.8rem; font-weight: 600;">✓ Splátka uhrazena</span>`
              : `<span style="color: var(--accent-amber); font-size: 0.8rem; font-weight: 600;">⏳ Čeká na potvrzení</span>`}
          </div>

          <div style="margin: 0.5rem 0;">
            <div style="font-size: 0.75rem; color: var(--text-muted);">Zbývající jistina:</div>
            <div style="font-size: 1.3rem; font-weight: 800;">${formatKc(debt.principalRemainingCents)}</div>
          </div>

          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            ${isPaidThisMonth
              ? `<button class="btn btn-danger btn-revert">Zrušit potvrzení platby</button>`
              : `<button class="btn btn-success btn-confirm">Potvrdit splátku ${formatKc(debt.monthlyPaymentCents)}</button>`}
            <button class="btn btn-secondary btn-edit">Upravit jistinu</button>
          </div>
        `;

        const btnConfirm = card.querySelector('.btn-confirm');
        if (btnConfirm) {
          btnConfirm.addEventListener('click', async () => {
            debt.principalRemainingCents = Math.max(0, debt.principalRemainingCents - debt.monthlyPaymentCents);
            debt.paymentHistory.push({ period: currentPeriod, date: new Date().toISOString().slice(0, 10), amountCents: debt.monthlyPaymentCents });
            await dbPut('debts_payable', debt);
            await render();
          });
        }

        const btnRevert = card.querySelector('.btn-revert');
        if (btnRevert) {
          btnRevert.addEventListener('click', async () => {
            const idx = debt.paymentHistory.findIndex(p => p.period === currentPeriod);
            if (idx !== -1) {
              debt.principalRemainingCents += debt.paymentHistory[idx].amountCents;
              debt.paymentHistory.splice(idx, 1);
              await dbPut('debts_payable', debt);
              await render();
            }
          });
        }

        const btnEdit = card.querySelector('.btn-edit');
        btnEdit.addEventListener('click', async () => {
          const val = prompt(`Zadej skutečný zůstatek pro ${debt.name} v Kč:`, (debt.principalRemainingCents / 100).toFixed(2));
          if (val !== null && val.trim() !== '') {
            debt.principalRemainingCents = toCents(val);
            await dbPut('debts_payable', debt);
            await render();
          }
        });

        debtsList.appendChild(card);
      });
    }

    // --- ZÁLOŽKA 3: CÍLE ---
    async function renderGoals() {
      const goals = await dbGetAll('savings_goals');
      const totalAllocatedCents = goals.reduce((sum, g) => sum + (g.allocatedCents || 0), 0);

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="card">
          <div class="card-title">Celkem vyčleněno na cíle</div>
          <div class="metric-value" style="color: var(--accent-green);">${formatKc(totalAllocatedCents)}</div>
          <div class="metric-sub">Peníze určené na konkrétní rezervy a plány</div>
        </div>

        <div style="margin: 1rem 0 0.5rem 0; display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">
            Plnění finančních cílů
          </h2>
        </div>

        <div id="goals-list" class="item-list"></div>
      `;

      const listContainer = document.getElementById('goals-list');
      goals.forEach(goal => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0.75rem';

        const percent = goal.targetCents > 0 ? Math.min(100, Math.round(((goal.allocatedCents || 0) / goal.targetCents) * 100)) : 0;

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <div style="font-size: 1rem; font-weight: 700;">${goal.name}</div>
              <div class="expense-meta">Cíl: ${goal.targetCents > 0 ? formatKc(goal.targetCents) : 'Bez limitu'}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 1.1rem; font-weight: 800; color: var(--accent-green);">${formatKc(goal.allocatedCents || 0)}</div>
              <div class="expense-meta">${percent} % splněno</div>
            </div>
          </div>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%;"></div>
          </div>

          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            <button class="btn btn-secondary btn-add-funds" style="font-size: 0.75rem;">+ Přidat peníze</button>
            <button class="btn btn-secondary btn-edit-goal" style="font-size: 0.75rem;">Upravit cíl</button>
          </div>
        `;

        card.querySelector('.btn-add-funds').addEventListener('click', async () => {
          const val = prompt(`Kolik Kč přidat na "${goal.name}"?`);
          if (val && val.trim()) {
            goal.allocatedCents = (goal.allocatedCents || 0) + toCents(val);
            await dbPut('savings_goals', goal);
            await render();
          }
        });

        card.querySelector('.btn-edit-goal').addEventListener('click', async () => {
          const val = prompt(`Cílová částka pro "${goal.name}" v Kč:`, (goal.targetCents / 100).toFixed(0));
          if (val !== null && val.trim() !== '') {
            goal.targetCents = toCents(val);
            await dbPut('savings_goals', goal);
            await render();
          }
        });

        listContainer.appendChild(card);
      });
    }

    // --- ZÁLOŽKA 4: NASTAVENÍ ---
    async function renderSettings() {
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="card">
          <div class="card-title">Zálohování a obnova dat</div>
          <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.4;">
            Veškerá data jsou uložena v tomto zařízení (IndexedDB). Kdykoliv si můžeš stáhnout kompletní záložní soubor.
          </div>

          <button id="btn-export-backup" class="btn btn-success" style="width: 100%; margin-bottom: 0.75rem;">
            ⬇️ Stáhnout kompletní zálohu (JSON)
          </button>

          <label class="btn btn-secondary" style="width: 100%; margin-bottom: 0.75rem;">
            ⬆️ Obnovit data ze souboru
            <input type="file" id="input-restore" accept=".json" style="display: none;">
          </label>

          <button id="btn-force-reload-data" class="btn btn-danger" style="width: 100%; margin-top: 0.5rem;">
            🔄 Synchronizovat přesné pohledávky k 15. 10. 2026
          </button>
        </div>

        <div class="card">
          <div class="card-title">Informace o aplikaci</div>
          <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
            <strong>Projekt:</strong> Koloběžníkův rozpočet<br>
            <strong>Typ:</strong> Lokální finanční PWA<br>
            <strong>Pohledávky:</strong> Obousměrná evidence (přičítání nových půjček i odečítání splátek s historií)
          </div>
        </div>
      `;

      document.getElementById('btn-export-backup').addEventListener('click', async () => {
        const backup = {
          appName: 'KolobeznikRozpocet',
          exportedAt: new Date().toISOString(),
          data: {
            recurring_templates: await dbGetAll('recurring_templates'),
            monthly_expenses: await dbGetAll('monthly_expenses'),
            debts_payable: await dbGetAll('debts_payable'),
            debts_receivable: await dbGetAll('debts_receivable'),
            savings_goals: await dbGetAll('savings_goals')
          }
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `kolobeznik-rozpocet-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      });

      document.getElementById('btn-force-reload-data').addEventListener('click', async () => {
        if (confirm('Nastavit přesné pohledávky k 15. 10. 2026 (KOV 6 650 Kč, JIŘÍ 750 Kč, MAGDA 2 700 Kč)?')) {
          await seedInitialData(true);
          alert('Pohledávky byly nastaveny.');
          setTab('debts');
        }
      });

      document.getElementById('input-restore').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!confirm('Obnova přepíše aktuální stav databáze daty ze souboru. Pokračovat?')) {
          e.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.appName !== 'KolobeznikRozpocet') throw new Error('Neplatný formát zálohy.');
            const db = await openDB();
            for (const storeName of Object.keys(parsed.data)) {
              const tx = db.transaction(storeName, 'readwrite');
              tx.objectStore(storeName).clear();
              for (const item of parsed.data[storeName]) {
                delete item.id;
                await dbAdd(storeName, item);
              }
            }
            alert('Záloha byla úspěšně obnovena!');
            setTab('debts');
          } catch (err) {
            alert('Chyba: ' + err.message);
          }
        };
        reader.readAsText(file);
      });
    }

    async function render() {
      await openDB();
      await seedInitialData();
      await ensureMonthInitialized(currentPeriod);

      if (activeTab === 'expenses') await renderExpenses();
      else if (activeTab === 'debts') await renderDebts();
      else if (activeTab === 'goals') await renderGoals();
      else if (activeTab === 'settings') await renderSettings();
    }

    render();
  </script>
</body>
</html>
