<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rozpočet">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Koloběžníkův rozpočet</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 90px; }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.05rem; font-weight: 700; }

    .period-selector {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background-color: var(--border);
      border-radius: 9999px;
      padding: 0.2rem 0.5rem;
    }

    .period-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0 0.3rem;
    }

    .period-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      min-width: 80px;
      text-align: center;
    }

    main { padding: 1rem; max-width: 600px; margin: 0 auto; }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: 1rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }

    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .metric-value { font-size: 1.35rem; font-weight: 800; }
    .metric-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

    .item-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .expense-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: border-color 0.15s ease;
    }

    .expense-item.paid {
      border-color: rgba(34, 197, 94, 0.4);
      background-color: rgba(34, 197, 94, 0.05);
    }

    .expense-item.paid .expense-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .expense-info { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; cursor: pointer; }
    .expense-name { font-size: 0.95rem; font-weight: 600; }
    .expense-meta { font-size: 0.75rem; color: var(--text-muted); }

    .expense-right { display: flex; align-items: center; gap: 0.6rem; text-align: right; }
    .expense-amount { font-size: 0.95rem; font-weight: 700; cursor: pointer; }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: transparent;
      cursor: pointer;
    }

    .expense-item.paid .check-circle {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
      font-weight: bold;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 0.25rem 0.35rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .btn-primary { background-color: var(--accent); color: #000; }
    .btn-success { background-color: var(--accent-green); color: #000; }
    .btn-secondary { background-color: var(--border); color: var(--text-main); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .sub-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
    }
    .sub-item-row:last-child { border-bottom: none; }

    .progress-bar-bg {
      background-color: var(--border);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    .chart-box {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-top: 0.75rem;
    }
    .chart-svg {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      transform: rotate(-90deg);
    }
    .chart-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.75rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .prio-badge {
      background-color: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Koloběžníkův rozpočet</h1>
    <div class="period-selector">
      <button id="btn-prev-period" class="period-btn">◀</button>
      <span id="period-label" class="period-label">Načítám...</span>
      <button id="btn-next-period" class="period-btn">▶</button>
    </div>
  </header>

  <main id="app-container">
    <div class="card">
      <div class="card-title">Stav</div>
      <div class="metric-value" style="color: var(--accent);">Načítám aplikaci...</div>
    </div>
  </main>

  <nav class="nav-bar">
    <button id="nav-dashboard" class="nav-btn active">Přehled</button>
    <button id="nav-expenses" class="nav-btn">Platby</button>
    <button id="nav-debts" class="nav-btn">Dluhy & Pohledávky</button>
    <button id="nav-goals" class="nav-btn">Cíle</button>
    <button id="nav-settings" class="nav-btn">Nastavení</button>
  </nav>

  <script>
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btn-install-pwa');
      if (installBtn) installBtn.style.display = 'block';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registrace:', err));
      });
    }

    const DB_NAME = 'KolobeznikRozpocetDB';
    const DB_VERSION = 3;

    let isStoragePersistent = false;
    async function requestPersistence() {
      if (navigator.storage && navigator.storage.persist) {
        isStoragePersistent = await navigator.storage.persist();
      }
    }
    requestPersistence();

    function toCents(amount) {
      if (amount === null || amount === undefined || amount === '') return 0;
      if (typeof amount === 'string') amount = amount.replace(/\s/g, '').replace(',', '.');
      const num = parseFloat(amount);
      return isNaN(num) ? 0 : Math.round(num * 100);
    }

    function formatKc(cents) {
      const crowns = (cents || 0) / 100;
      return new Intl.NumberFormat('cs-CZ', {
        style: 'currency',
        currency: 'CZK',
        minimumFractionDigits: crowns % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }).format(crowns);
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('recurring_templates')) db.createObjectStore('recurring_templates', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('monthly_expenses')) {
            const s = db.createObjectStore('monthly_expenses', { keyPath: 'id', autoIncrement: true });
            s.createIndex('period', 'period', { unique: false });
          }
          if (!db.objectStoreNames.contains('incomes')) {
            const s = db.createObjectStore('incomes', { keyPath: 'id', autoIncrement: true });
            s.createIndex('period', 'period', { unique: false });
          }
          if (!db.objectStoreNames.contains('debts_payable')) db.createObjectStore('debts_payable', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('debts_receivable')) db.createObjectStore('debts_receivable', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('savings_goals')) db.createObjectStore('savings_goals', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('accounts')) db.createObjectStore('accounts', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('app_config')) db.createObjectStore('app_config', { keyPath: 'key' });
        };
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbAdd(storeName, item) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).add(item);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).put(item);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function dbDelete(storeName, id) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).delete(id);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function clearStore(storeName) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).clear();
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });
    }

    async function getConfig(key, defaultValue = null) {
      const db = await openDB();
      return new Promise((res) => {
        const tx = db.transaction('app_config', 'readonly');
        const req = tx.objectStore('app_config').get(key);
        req.onsuccess = () => res(req.result ? req.result.value : defaultValue);
        req.onerror = () => res(defaultValue);
      });
    }

    async function setConfig(key, value) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction('app_config', 'readwrite');
        const req = tx.objectStore('app_config').put({ key, value });
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });
    }

    // --- VÝCHOZÍ CÍLE S PŘESNÝMI POZICEMI ---
    async function seedInitialData(forceReload = false) {
      const currentInitialBalance = await getConfig('initial_account_balance', null);
      if (currentInitialBalance === null || forceReload) {
        await setConfig('initial_account_balance', toCents('71500'));
      }

      const existingGoals = await dbGetAll('savings_goals');
      if (existingGoals.length === 0 || forceReload) {
        await clearStore('savings_goals');
        const prioritizedGoals = [
          { name: 'Brikety na zimu', targetCents: toCents('11000'), priority: 1, paused: false },
          { name: 'Právní výdaje', targetCents: toCents('20000'), priority: 2, paused: false },
          { name: 'Železná finanční rezerva', targetCents: toCents('60000'), priority: 3, paused: false },
          { name: 'Zubní náhrada', targetCents: toCents('30000'), priority: 4, paused: true },
          { name: 'Koloběžka', targetCents: toCents('25000'), priority: 5, paused: true },
          { name: 'Cestování do Itálie, Monaka a Nice', targetCents: toCents('16000'), priority: 6, paused: true }
        ];
        for (const g of prioritizedGoals) await dbAdd('savings_goals', g);
      }

      const existingReceivables = await dbGetAll('debts_receivable');
      if (existingReceivables.length === 0 || forceReload) {
        await clearStore('debts_receivable');
        const initialList = [
          { debtor: 'KOV', category: 'Půjčky', originalAmountCents: toCents('3400'), remainingAmountCents: toCents('3400'), history: [] },
          { debtor: 'KOV', category: 'Elektřina a drogerie', originalAmountCents: toCents('2750'), remainingAmountCents: toCents('2750'), history: [] },
          { debtor: 'KOV', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] },

          { debtor: 'JIŘÍ', category: 'Půjčky', originalAmountCents: toCents('0'), remainingAmountCents: toCents('0'), history: [] },
          { debtor: 'JIŘÍ', category: 'Elektřina a drogerie', originalAmountCents: toCents('1500'), remainingAmountCents: toCents('250'), history: [{ date: '2026-10-13', amountCents: toCents('1250'), type: 'payment', note: 'Zaplaceno na elektřinu a drogerii' }] },
          { debtor: 'JIŘÍ', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] },

          { debtor: 'MAGDA', category: 'Půjčky', originalAmountCents: toCents('700'), remainingAmountCents: toCents('700'), history: [] },
          { debtor: 'MAGDA', category: 'Elektřina a drogerie', originalAmountCents: toCents('1500'), remainingAmountCents: toCents('1500'), history: [] },
          { debtor: 'MAGDA', category: 'Fólie na bazén', originalAmountCents: toCents('500'), remainingAmountCents: toCents('500'), history: [] }
        ];
        for (const item of initialList) await dbAdd('debts_receivable', item);
      }

      const existingTemplates = await dbGetAll('recurring_templates');
      if (existingTemplates.length === 0) {
        const defaultExpenses = [
          { name: 'Česká televize', amountCents: toCents('150'), category: 'Bydlení', dueDay: 15, active: true },
          { name: 'Vodafone – telefon', amountCents: toCents('266'), category: 'Komunikace', dueDay: 15, active: true },
          { name: 'T-Mobile – internet', amountCents: toCents('450'), category: 'Komunikace', dueDay: 20, active: true },
          { name: 'PVZP – pojištění', amountCents: toCents('400'), category: 'Pojištění', dueDay: 20, active: true },
          { name: 'AvaFin/Crediton – splátka', amountCents: toCents('1100'), category: 'Dluhy a splátky', dueDay: 10, isLoanRepayment: true, active: true },
          { name: 'Provident – splátka', amountCents: toCents('1500'), category: 'Dluhy a splátky', dueDay: 10, isLoanRepayment: true, active: true },
          { name: 'Penzijní příspěvek', amountCents: toCents('100'), category: 'Spoření', dueDay: 15, active: true },
          { name: 'ČEZ – záloha na elektřinu', amountCents: toCents('3000'), category: 'Energie', dueDay: 15, active: true },
          { name: 'Terapie', amountCents: toCents('2000'), category: 'Zdraví', dueDay: 1, active: true },
          { name: 'Investown', amountCents: toCents('500'), category: 'Investice', dueDay: 10, active: true },
          { name: 'ChatGPT Go', amountCents: toCents('200'), category: 'Služby & Předplatné', dueDay: 1, active: true },
          { name: 'SIPO', amountCents: toCents('77'), category: 'Bydlení', dueDay: 12, active: true },
          { name: 'Spotify', amountCents: toCents('185'), category: 'Zábava', dueDay: 5, active: true },
          { name: 'Google AI Pro', amountCents: toCents('139,90'), category: 'Služby & Předplatné', dueDay: 8, active: true }
        ];
        for (const item of defaultExpenses) await dbAdd('recurring_templates', item);

        await dbAdd('debts_payable', { name: 'Provident', principalRemainingCents: toCents('77327,33'), monthlyPaymentCents: toCents('1500'), dueDay: 10 });
        await dbAdd('debts_payable', { name: 'AvaFin/Crediton', principalRemainingCents: toCents('19524'), monthlyPaymentCents: toCents('1100'), dueDay: 10 });
      }
    }

    const czechMonths = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
    let viewDate = new Date();

    function formatPeriodKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function updatePeriodLabel() {
      document.getElementById('period-label').textContent = `${czechMonths[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
    }

    document.getElementById('btn-prev-period').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      updatePeriodLabel();
      render();
    });

    document.getElementById('btn-next-period').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      updatePeriodLabel();
      render();
    });

    async function ensureMonthInitialized(periodKey) {
      const allMonthly = await dbGetAll('monthly_expenses');
      const monthItems = allMonthly.filter(item => item.period === periodKey);
      if (monthItems.length > 0) return monthItems;

      const templates = await dbGetAll('recurring_templates');
      const created = [];
      for (const t of templates) {
        if (t.active === false) continue;
        const item = {
          templateId: t.id,
          name: t.name,
          category: t.category,
          plannedAmountCents: t.amountCents,
          paidAmountCents: 0,
          dueDay: t.dueDay || 15,
          period: periodKey,
          isPaid: false,
          isLoanRepayment: !!t.isLoanRepayment
        };
        const id = await dbAdd('monthly_expenses', item);
        item.id = id;
        created.push(item);
      }
      return created;
    }

    async function getCurrentAccountBalance(periodKey) {
      const baseInitialBalance = await getConfig('initial_account_balance', toCents('71500'));
      const allExpenses = await dbGetAll('monthly_expenses');
      const allIncomes = await dbGetAll('incomes');

      let totalIncomesCents = 0;
      for (const inc of allIncomes) {
        if (inc.period <= periodKey) totalIncomesCents += inc.amountCents;
      }

      let totalPaidExpensesCents = 0;
      for (const exp of allExpenses) {
        if (exp.period <= periodKey && exp.isPaid) totalPaidExpensesCents += exp.plannedAmountCents;
      }

      return baseInitialBalance + totalIncomesCents - totalPaidExpensesCents;
    }

    // Načte cíle a normalizuje priority (1, 2, 3...)
    async function getSortedGoalsFromDB() {
      const goals = await dbGetAll('savings_goals');
      goals.sort((a, b) => (Number(a.priority) || 99) - (Number(b.priority) || 99));
      return goals;
    }

    // Uloží srovnané priority zpět do DB
    async function reassignAndSavePriorities(goalsArray) {
      for (let i = 0; i < goalsArray.length; i++) {
        goalsArray[i].priority = i + 1;
        await dbPut('savings_goals', goalsArray[i]);
      }
    }

    async function getSmartGoalsAllocation(availableMoneyCents) {
      const goals = await getSortedGoalsFromDB();
      let remainingMoney = Math.max(0, availableMoneyCents);
      const allocatedGoals = [];

      for (const g of goals) {
        const target = g.targetCents || 0;
        let funded = 0;

        if (!g.paused && target > 0) {
          funded = Math.min(remainingMoney, target);
          remainingMoney -= funded;
        }

        const missing = Math.max(0, target - funded);
        const percent = target > 0 ? Math.round((funded / target) * 100) : 100;

        allocatedGoals.push({
          ...g,
          allocatedCents: funded,
          missingCents: missing,
          percent
        });
      }

      return {
        goals: allocatedGoals,
        unallocatedMoneyCents: remainingMoney
      };
    }

    function renderPieChartSVG(slices) {
      const total = slices.reduce((sum, s) => sum + s.value, 0);
      if (total <= 0) {
        return `<svg viewBox="0 0 36 36" class="chart-svg"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#334155" stroke-width="3.8"/></svg>`;
      }

      let cumulativePercent = 0;
      const strokeWidth = 5;
      const radius = 15.91549430918954;

      const paths = slices.map(slice => {
        const percent = (slice.value / total) * 100;
        if (percent <= 0) return '';
        const dashArray = `${percent} ${100 - percent}`;
        const dashOffset = 100 - cumulativePercent;
        cumulativePercent += percent;

        return `<circle cx="18" cy="18" r="${radius}" fill="none" stroke="${slice.color}" stroke-width="${strokeWidth}" stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}"/>`;
      }).join('');

      return `<svg viewBox="0 0 36 36" class="chart-svg">${paths}</svg>`;

          let existingItem = personItems.find(i => i.category.toLowerCase() === chosenCategory.toLowerCase());

          if (existingItem) {
            existingItem.remainingAmountCents += addCents;
            existingItem.originalAmountCents += addCents;
            if (!existingItem.history) existingItem.history = [];
            existingItem.history.push({
              date: dateStr || new Date().toISOString().slice(0, 10),
              amountCents: addCents,
              type: 'loan',
              note: `Přičteno: ${chosenCategory}`
            });
            await dbPut('debts_receivable', existingItem);
          } else {
            await dbAdd('debts_receivable', {
              debtor: personName,
              category: chosenCategory,
              originalAmountCents: addCents,
              remainingAmountCents: addCents,
              history: [{
                date: dateStr || new Date().toISOString().slice(0, 10),
                amountCents: addCents,
                type: 'loan',
                note: `Přičteno: ${chosenCategory}`
              }]
            });
          }

          await render();
        });

        card.querySelector('.btn-pay-debt').addEventListener('click', async () => {
          let catMenu = `Na kterou položku ${personName} platí?\n\n`;
          personItems.forEach((it, idx) => {
            catMenu += `${idx + 1} = ${it.category} (zbývá: ${(it.remainingAmountCents / 100).toFixed(0)} Kč)\n`;
          });

          const choice = prompt(catMenu, '1');
          if (!choice) return;
          const idx = parseInt(choice, 10) - 1;
          const targetItem = personItems[idx];
          if (!targetItem) return alert('Neplatná volba.');

          const defaultAmount = (targetItem.remainingAmountCents / 100).toFixed(0);
          const valStr = prompt(`Kolik Kč ${personName} zaplatil/a na "${targetItem.category}"?`, defaultAmount);
          if (!valStr || !valStr.trim()) return;

          const paidCents = toCents(valStr);
          const dateStr = prompt('Datum zaplacení (RRRR-MM-DD):', new Date().toISOString().slice(0, 10));

          targetItem.remainingAmountCents = Math.max(0, targetItem.remainingAmountCents - paidCents);
          if (!targetItem.history) targetItem.history = [];
          targetItem.history.push({
            date: dateStr || new Date().toISOString().slice(0, 10),
            amountCents: paidCents,
            type: 'payment',
            note: `Zaplaceno na ${targetItem.category}`
          });

          await dbPut('debts_receivable', targetItem);
          await render();
        });

        card.querySelectorAll('.btn-edit-category').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = parseInt(btn.getAttribute('data-id'), 10);
            const target = receivables.find(r => r.id === id);
            if (!target) return;

            const action = prompt(`Položka: ${target.debtor} – ${target.category}\nZbývá: ${(target.remainingAmountCents / 100).toFixed(2)} Kč\n\n1 = Upravit částku\n2 = Smazat položku`, '1');
            if (action === '1') {
              const val = prompt('Nový zůstatek v Kč:', (target.remainingAmountCents / 100).toFixed(2));
              if (val !== null && val.trim() !== '') {
                target.remainingAmountCents = toCents(val);
                await dbPut('debts_receivable', target);
                await render();
              }
            } else if (action === '2') {
              if (confirm(`Opravdu smazat položku "${target.category}" u ${target.debtor}?`)) {
                await dbDelete('debts_receivable', target.id);
                await render();
              }
            }
          });
        });

        groupedContainer.appendChild(card);
      });

      const debtsList = document.getElementById('debts-list');
      debts.forEach(debt => {
        if (!debt.paymentHistory) debt.paymentHistory = [];
        const isPaidThisMonth = debt.paymentHistory.some(p => p.period === curPeriod);

        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0.5rem';

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <div>
              <div style="font-size: 1.05rem; font-weight: 700;">${debt.name}</div>
              <div class="expense-meta">Měsíční splátka: ${formatKc(debt.monthlyPaymentCents)} (k 10. dni)</div>
            </div>
            ${isPaidThisMonth
              ? `<span style="color: var(--accent-green); font-size: 0.8rem; font-weight: 600;">✓ Splátka uhrazena</span>`
              : `<span style="color: var(--accent-amber); font-size: 0.8rem; font-weight: 600;">⏳ Čeká na potvrzení</span>`}
          </div>

          <div style="margin: 0.5rem 0;">
            <div style="font-size: 0.75rem; color: var(--text-muted);">Zbývající jistina:</div>
            <div style="font-size: 1.3rem; font-weight: 800;">${formatKc(debt.principalRemainingCents)}</div>
          </div>

          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            ${isPaidThisMonth
              ? `<button class="btn btn-danger btn-revert">Zrušit potvrzení platby</button>`
              : `<button class="btn btn-success btn-confirm">Potvrdit splátku ${formatKc(debt.monthlyPaymentCents)}</button>`}
            <button class="btn btn-secondary btn-edit">Upravit jistinu</button>
          </div>
        `;

        const btnConfirm = card.querySelector('.btn-confirm');
        if (btnConfirm) {
          btnConfirm.addEventListener('click', async () => {
            debt.principalRemainingCents = Math.max(0, debt.principalRemainingCents - debt.monthlyPaymentCents);
            debt.paymentHistory.push({ period: curPeriod, date: new Date().toISOString().slice(0, 10), amountCents: debt.monthlyPaymentCents });
            await dbPut('debts_payable', debt);
            await render();
          });
        }

        const btnRevert = card.querySelector('.btn-revert');
        if (btnRevert) {
          btnRevert.addEventListener('click', async () => {
            const idx = debt.paymentHistory.findIndex(p => p.period === curPeriod);
            if (idx !== -1) {
              debt.principalRemainingCents += debt.paymentHistory[idx].amountCents;
              debt.paymentHistory.splice(idx, 1);
              await dbPut('debts_payable', debt);
              await render();
            }
          });
        }

        const btnEdit = card.querySelector('.btn-edit');
        btnEdit.addEventListener('click', async () => {
          const val = prompt(`Zadej skutečný zůstatek pro ${debt.name} v Kč:`, (debt.principalRemainingCents / 100).toFixed(2));
          if (val !== null && val.trim() !== '') {
            debt.principalRemainingCents = toCents(val);
            await dbPut('debts_payable', debt);
            await render();
          }
        });

        debtsList.appendChild(card);
      });
    }

    // --- ZÁLOŽKA 3: CHYTRÉ CÍLE S PLNOU A SPOLEHLIVOU ZMĚNOU POŘADÍ ---
    async function renderGoals() {
      const curPeriod = formatPeriodKey(viewDate);
      const currentAccountBalanceCents = await getCurrentAccountBalance(curPeriod);
      const { goals: smartGoals, unallocatedMoneyCents } = await getSmartGoalsAllocation(currentAccountBalanceCents);

      const totalTargetCents = smartGoals.reduce((sum, g) => sum + (g.targetCents || 0), 0);
      const totalCoveredCents = smartGoals.reduce((sum, g) => sum + g.allocatedCents, 0);
      const totalMissingCents = Math.max(0, totalTargetCents - totalCoveredCents);

      const goalChartColors = ['#22c55e', '#38bdf8', '#f59e0b', '#a855f7', '#14b8a6', '#ec4899'];
      const goalSlices = smartGoals.filter(g => g.allocatedCents > 0).map((g, idx) => ({
        label: g.name,
        value: g.allocatedCents,
        color: goalChartColors[idx % goalChartColors.length]
      }));

      if (totalMissingCents > 0) {
        goalSlices.push({
          label: 'Zbývá našetřit',
          value: totalMissingCents,
          color: '#334155'
        });
      }

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="card" style="border-left: 4px solid var(--accent);">
          <div class="card-title">Stav spoření z peněz na účtu</div>
          <div class="metric-value" style="color: var(--accent-green);">${formatKc(totalCoveredCents)}</div>
          <div class="metric-sub">
            Zůstatek <strong>${formatKc(currentAccountBalanceCents)}</strong> kryje <strong>${formatKc(totalCoveredCents)}</strong> z celkových plánů <strong>${formatKc(totalTargetCents)}</strong>.
            ${unallocatedMoneyCents > 0 ? `<div style="color: var(--accent); margin-top: 0.2rem;">Volná rezerva navíc nad aktivními cíli: +${formatKc(unallocatedMoneyCents)}</div>` : ''}
          </div>
        </div>

        <div class="card">
          <div class="card-title">Graf pokrytí finančních cílů</div>
          <div class="chart-box">
            ${renderPieChartSVG(goalSlices)}
            <div class="chart-legend">
              ${goalSlices.map(s => `
                <div class="legend-item">
                  <div class="legend-color" style="background-color: ${s.color};"></div>
                  <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.label}</div>
                  <strong>${formatKc(s.value)}</strong>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div style="margin: 1.25rem 0 0.5rem 0; display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">
            Seznam cílů (řazeno dle priority)
          </h2>
          <button id="btn-add-new-goal" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">+ Nový cíl</button>
        </div>

        <div id="goals-list" class="item-list"></div>
      `;

      document.getElementById('btn-add-new-goal').addEventListener('click', async () => {
        const name = prompt('Název nového cíle:');
        if (!name || !name.trim()) return;
        const targetStr = prompt(`Cílová částka pro "${name}" v Kč:`, '10000');

        const all = await getSortedGoalsFromDB();
        all.push({
          name: name.trim(),
          targetCents: toCents(targetStr),
          priority: all.length + 1,
          paused: false
        });
        await reassignAndSavePriorities(all);
        await render();
      });

      const listContainer = document.getElementById('goals-list');
      smartGoals.forEach((goal, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0.75rem';

        const isFullyFunded = goal.missingCents === 0;

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <div style="display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.2rem;">
                <span class="prio-badge btn-pick-prio" data-idx="${idx}" title="Klepnutím změníš pozici">#${goal.priority}</span>
                <span style="font-size: 1rem; font-weight: 700;">${goal.name}</span>
              </div>
              <div class="expense-meta">
                Cíl: <strong>${formatKc(goal.targetCents)}</strong>
                ${goal.paused ? '<span style="font-size:0.7rem; color:var(--accent-amber); margin-left:0.3rem; border:1px solid var(--accent-amber); padding:0.1rem 0.35rem; border-radius:4px;">Odloženo (počká)</span>' : ''}
              </div>
            </div>

            <div style="text-align: right;">
              <div style="font-size: 1.1rem; font-weight: 800; color: ${goal.paused ? 'var(--text-muted)' : (isFullyFunded ? 'var(--accent-green)' : (goal.allocatedCents > 0 ? 'var(--accent-amber)' : 'var(--text-muted)'))};">
                ${formatKc(goal.allocatedCents)}
              </div>
              <div class="expense-meta">${goal.paused ? '0 % (odloženo)' : `${goal.percent} % pokryto`}</div>
            </div>
          </div>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${goal.percent}%; background-color: ${goal.paused ? 'var(--border)' : (isFullyFunded ? 'var(--accent-green)' : 'var(--accent-amber)')};"></div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem; font-size: 0.8rem;">
            <span style="color: ${goal.paused ? 'var(--text-muted)' : (isFullyFunded ? 'var(--accent-green)' : 'var(--accent-amber)')}; font-weight: 600;">
              ${goal.paused ? 'Peníze se přednostně použijí na jiné cíle' : (isFullyFunded ? '✓ Kompletně pokryto penězi z účtu' : `Zbývá našetřit: ${formatKc(goal.missingCents)}`)}
            </span>
          </div>

          <!-- VELKÁ TLÍČÍTKA PRO SNADNÉ PŘESOUVÁNÍ NA MOBILU -->
          <div style="display: flex; gap: 0.35rem; margin-top: 0.75rem;">
            <button class="btn btn-secondary btn-move-up" data-idx="${idx}" style="flex: 1;" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>
              ▲ Nahoru
            </button>
            <button class="btn btn-secondary btn-move-down" data-idx="${idx}" style="flex: 1;" ${idx === smartGoals.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>
              ▼ Dolů
            </button>
            <button class="btn btn-secondary btn-toggle-pause" data-id="${goal.id}" style="padding: 0.4rem 0.6rem;">
              ${goal.paused ? '▶ Aktivovat' : '⏸ Odložit'}
            </button>
            <button class="btn btn-secondary btn-edit-goal" data-id="${goal.id}" style="padding: 0.4rem 0.6rem;">
              ✏️
            </button>
          </div>
        `;

        // Posun NAHORU
        const btnUp = card.querySelector('.btn-move-up');
        if (btnUp && idx > 0) {
          btnUp.addEventListener('click', async () => {
            const all = await getSortedGoalsFromDB();
            const currentItem = all.splice(idx, 1)[0];
            all.splice(idx - 1, 0, currentItem);
            await reassignAndSavePriorities(all);
            await render();
          });
        }

        // Posun DOLŮ
        const btnDown = card.querySelector('.btn-move-down');
        if (btnDown && idx < smartGoals.length - 1) {
          btnDown.addEventListener('click', async () => {
            const all = await getSortedGoalsFromDB();
            const currentItem = all.splice(idx, 1)[0];
            all.splice(idx + 1, 0, currentItem);
            await reassignAndSavePriorities(all);
            await render();
          });
        }

        // Klepnutí na štítek #1, #2 pro přímé zadání pozice
        card.querySelector('.btn-pick-prio').addEventListener('click', async () => {
          const newPosStr = prompt(`Zadej novou pozici pro "${goal.name}" (1 až ${smartGoals.length}):`, (idx + 1).toString());
          if (!newPosStr) return;
          const targetIndex = parseInt(newPosStr, 10) - 1;
          if (targetIndex >= 0 && targetIndex < smartGoals.length && targetIndex !== idx) {
            const all = await getSortedGoalsFromDB();
            const currentItem = all.splice(idx, 1)[0];
            all.splice(targetIndex, 0, currentItem);
            await reassignAndSavePriorities(all);
            await render();
          }
        });

        // Odložit / Aktivovat
        card.querySelector('.btn-toggle-pause').addEventListener('click', async () => {
          goal.paused = !goal.paused;
          await dbPut('savings_goals', goal);
          await render();
        });

        // Úprava částky, názvu, smazání
        card.querySelector('.btn-edit-goal').addEventListener('click', async () => {
          const action = prompt(
            `Úprava: ${goal.name}\n` +
            `Cílová částka: ${(goal.targetCents / 100).toFixed(0)} Kč\n\n` +
            `1 = Změnit cílovou částku\n` +
            `2 = Přejmenovat cíl\n` +
            `3 = Smazat tento cíl`,
            '1'
          );

          if (action === '1') {
            const val = prompt(`Nová cílová částka pro "${goal.name}" v Kč:`, (goal.targetCents / 100).toFixed(0));
            if (val !== null && val.trim() !== '') {
              goal.targetCents = toCents(val);
              await dbPut('savings_goals', goal);
              await render();
            }
          } else if (action === '2') {
            const val = prompt('Nový název:', goal.name);
            if (val && val.trim()) {
              goal.name = val.trim();
              await dbPut('savings_goals', goal);
              await render();
            }
          } else if (action === '3') {
            if (confirm(`Opravdu smazat cíl "${goal.name}"?`)) {
              await dbDelete('savings_goals', goal.id);
              const all = await getSortedGoalsFromDB();
              await reassignAndSavePriorities(all);
              await render();
            }
          }
        });

        listContainer.appendChild(card);
      });
    }

      const initialBalanceCents = await getConfig('initial_account_balance', toCents('71500'));

      const container = document.getElementById('app-container');
      
      const storageStatusHtml = isStoragePersistent

        : `<span style="color: var(--accent-amber); font-weight: bold;">⚡ Standardní lokální úložiště</span>`;

      container.innerHTML = `
        <div class="card">
          <div class="card-title">Výchozí stav peněz na účtu</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin: 0.5rem 0;">
            <div>
              <div style="font-size: 1.25rem; font-weight: bold; color: var(--accent);">${formatKc(initialBalanceCents)}</div>
              <div class="metric-sub">Základní zůstatek pro výpočet krytí cílů</div>
            </div>
            <button id="btn-edit-initial-balance" class="btn btn-secondary">Změnit zůstatek</button>
          </div>

          <div class="card-title">Instalace do telefonu</div>

          </button>
          <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
            Aplikace běží jako samostatná PWA s prioritním krytím cílů.
          </div>
        </div>

        <div class="card">
          <div class="card-title">Stav ochrany dat</div>
          <div style="font-size: 0.85rem; margin-bottom: 0.5rem;">${storageStatusHtml}</div>
          <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
            Veškeré změny se okamžitě a trvale ukládají do lokální databáze (IndexedDB).
          </div>
        </div>

        <div class="card">
          <div class="card-title">Zálohování a obnova</div>

          <button id="btn-export-backup" class="btn btn-success" style="width: 100%; margin-bottom: 0.6rem;">
            ⬇️ Stáhnout soubor zálohy (.JSON)
          </button>

          <button id="btn-copy-backup" class="btn btn-primary" style="width: 100%; margin-bottom: 0.6rem;">
            📋 Zkopírovat zálohu do schránky (pro e-mail/poznámky)
          </button>

          <label class="btn btn-secondary" style="width: 100%; margin-bottom: 0.6rem;">
            ⬆️ Obnovit data ze souboru
            <input type="file" id="input-restore" accept=".json" style="display: none;">
          </label>

          <button id="btn-force-reload-data" class="btn btn-danger" style="width: 100%; margin-top: 0.5rem;">
            🔄 Reset do výchozího stavu k 15. 10. 2026
          </button>
        </div>

        <div class="card">
          <div class="card-title">Informace o aplikaci</div>
          <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
            <strong>Projekt:</strong> Koloběžníkův rozpočet<br>
            <strong>Cíle:</strong> Plné přehazování priorit tlačítky ▲ / ▼ i přímým zadáním pozice<br>
            <strong>Chytrá alokace:</strong> Peníze se okamžitě přelévají do cílů na horních pozicích
          </div>
        </div>
      `;

      document.getElementById('btn-edit-initial-balance').addEventListener('click', async () => {
        const currentKc = (initialBalanceCents / 100).toFixed(0);
        const val = prompt('Zadej aktuální stav peněz na účtu v Kč:', currentKc);
        if (val !== null && val.trim() !== '') {
          await setConfig('initial_account_balance', toCents(val));
          await render();
        }
      });

      const installBtn = document.getElementById('btn-install-pwa');
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              deferredPrompt = null;
              installBtn.style.display = 'none';
            }
          }
        });
      }

      document.getElementById('btn-export-backup').addEventListener('click', async () => {
        const backup = await getBackupPayload();
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `kolobeznik-rozpocet-zaloha-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      });

      document.getElementById('btn-copy-backup').addEventListener('click', async () => {
        const backup = await getBackupPayload();
        const jsonStr = JSON.stringify(backup);
        try {
          await navigator.clipboard.writeText(jsonStr);
          alert('Kompletní záloha byla zkopírována do schránky!');
        } catch (err) {
          prompt('Zkopíruj si tento text zálohy ručně:', jsonStr);
        }
      });

      document.getElementById('btn-force-reload-data').addEventListener('click', async () => {
        if (confirm('Nastavit znovu výchozí priority (Brikety, Právo, Rezerva) a 71 500 Kč na účtu?')) {
          await seedInitialData(true);
          alert('Data byla nastavena.');
          setTab('goals');
        }
      });

      document.getElementById('input-restore').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!confirm('Obnova přepíše aktuální stav databáze daty ze souboru. Pokračovat?')) {
          e.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.appName !== 'KolobeznikRozpocet') throw new Error('Neplatný formát zálohy.');
            const db = await openDB();
            for (const storeName of Object.keys(parsed.data)) {
              const tx = db.transaction(storeName, 'readwrite');
              tx.objectStore(storeName).clear();
              for (const item of parsed.data[storeName]) {
                delete item.id;
                await dbAdd(storeName, item);
              }
            }
            alert('Záloha byla úspěšně obnovena!');
            setTab('dashboard');
          } catch (err) {
            alert('Chyba: ' + err.message);
          }
        };
        reader.readAsText(file);
      });
    }

    async function getBackupPayload() {
      return {
        appName: 'KolobeznikRozpocet',
        exportedAt: new Date().toISOString(),
        data: {
          recurring_templates: await dbGetAll('recurring_templates'),
          monthly_expenses: await dbGetAll('monthly_expenses'),
          incomes: await dbGetAll('incomes'),
          debts_payable: await dbGetAll('debts_payable'),
          debts_receivable: await dbGetAll('debts_receivable'),
          savings_goals: await dbGetAll('savings_goals')
        }
      };
    }

    async function render() {
      await openDB();
      await seedInitialData();
      const curPeriod = formatPeriodKey(viewDate);
      await ensureMonthInitialized(curPeriod);
      updatePeriodLabel();

      if (activeTab === 'dashboard') await renderDashboard();
      else if (activeTab === 'expenses') await renderExpenses();
      else if (activeTab === 'debts') await renderDebts();
      else if (activeTab === 'goals') await renderGoals();
      else if (activeTab === 'settings') await renderSettings();
    }

    render();
  </script>
</body>
</html>
